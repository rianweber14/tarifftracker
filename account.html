<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - AITariffTracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .header {
      background: white;
      border-radius: 0.5rem;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .header h1 {
      color: #2563eb;
      margin-bottom: 0.5rem;
    }
    
    .header p {
      color: #64748b;
    }
    
    .account-section {
      background: white;
      border-radius: 0.5rem;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .account-section h2 {
      color: #1e293b;
      margin-bottom: 1rem;
      font-size: 1.25rem;
    }
    
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    
    .info-item {
      padding: 1rem;
      background: #f8fafc;
      border-radius: 0.375rem;
      border: 1px solid #e2e8f0;
    }
    
    .info-item label {
      display: block;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.25rem;
      font-size: 0.875rem;
    }
    
    .info-item .value {
      color: #1e293b;
      font-weight: 600;
    }
    
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.375rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #2563eb;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1d4ed8;
    }
    
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    
    .btn-danger {
      background: #dc2626;
      color: white;
    }
    
    .btn-danger:hover {
      background: #b91c1c;
    }
    
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .status-active {
      background: #dcfce7;
      color: #166534;
    }
    
    .status-inactive {
      background: #fef2f2;
      color: #991b1b;
    }
    
    .status-free {
      background: #f1f5f9;
      color: #475569;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }
    
    .error-message {
      background: #fef2f2;
      color: #dc2626;
      padding: 1rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
    }
    
    .nav-links {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    
    .nav-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    
    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Breadcrumb Navigation -->
    <nav class="breadcrumb">
      <a href="/">Home</a>
      <span class="breadcrumb-separator">›</span>
      <span>My Account</span>
    </nav>
    
    <div class="header">
      <h1>My Account</h1>
      <p>Manage your subscription and account settings</p>
    </div>
    
    <div id="loading" class="loading">Loading account information...</div>
    
    <div id="error-message" class="error-message" style="display: none;"></div>
    
    <div id="account-content" style="display: none;">
      <div class="account-section">
        <h2>Account Information</h2>
        <div class="info-grid">
          <div class="info-item">
            <label>Email</label>
            <div class="value" id="user-email">-</div>
          </div>
          <div class="info-item">
            <label>Member Since</label>
            <div class="value" id="member-since">-</div>
          </div>
          <div class="info-item">
            <label>Account Status</label>
            <div class="value">
              <span id="account-status" class="status-badge status-active">Active</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="account-section">
        <h2>Subscription Details</h2>
        <div class="info-grid">
          <div class="info-item">
            <label>Current Plan</label>
            <div class="value" id="current-plan">Free</div>
          </div>
          <div class="info-item">
            <label>Billing Cycle</label>
            <div class="value" id="billing-cycle">-</div>
          </div>
          <div class="info-item">
            <label>Next Billing Date</label>
            <div class="value" id="next-billing">-</div>
          </div>
          <div class="info-item">
            <label>Subscription Status</label>
            <div class="value">
              <span id="subscription-status" class="status-badge status-free">Free</span>
            </div>
          </div>
        </div>
        
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
          <button id="manage-subscription-btn" class="btn btn-primary" style="display: none;">
            Manage Subscription
          </button>
          <a href="/checkout.html" class="btn btn-primary" id="upgrade-btn">
            Upgrade Plan
          </a>
        </div>
      </div>
      
      <div class="account-section">
        <h2>Account Actions</h2>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button id="logout-btn" class="btn btn-secondary">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let currentUser = null;
    let currentSubscription = null;
    
    // Load account information
    async function loadAccountInfo() {
      try {
        // Check if user is logged in
        currentUser = await getCurrentUser();
        
        if (!currentUser) {
          window.location.href = '/login.html?return=/account.html';
          return;
        }
        
        // Update user information
        document.getElementById('user-email').textContent = currentUser.email;
        document.getElementById('member-since').textContent = new Date(currentUser.created_at).toLocaleDateString();
        
        // Check subscription
        currentSubscription = await checkSubscription();
        
        if (currentSubscription) {
          updateSubscriptionInfo(currentSubscription);
        } else {
          updateFreeUserInfo();
        }
        
        // Show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('account-content').style.display = 'block';
        
      } catch (error) {
        console.error('Error loading account info:', error);
        showError('Failed to load account information. Please try again.');
      }
    }
    
    function updateSubscriptionInfo(subscription) {
      const planName = subscription.plan_type.charAt(0).toUpperCase() + subscription.plan_type.slice(1);
      
      document.getElementById('current-plan').textContent = planName;
      document.getElementById('billing-cycle').textContent = subscription.billing_cycle || 'Monthly';
      
      if (subscription.current_period_end) {
        const endDate = new Date(subscription.current_period_end * 1000);
        document.getElementById('next-billing').textContent = endDate.toLocaleDateString();
      }
      
      const statusElement = document.getElementById('subscription-status');
      statusElement.textContent = subscription.status;
      statusElement.className = `status-badge ${subscription.status === 'active' ? 'status-active' : 'status-inactive'}`;
      
      // Show manage subscription button
      document.getElementById('manage-subscription-btn').style.display = 'inline-block';
      
      // Update upgrade button text
      document.getElementById('upgrade-btn').textContent = 'Change Plan';
    }
    
    function updateFreeUserInfo() {
      document.getElementById('current-plan').textContent = 'Free';
      document.getElementById('billing-cycle').textContent = '-';
      document.getElementById('next-billing').textContent = '-';
      
      const statusElement = document.getElementById('subscription-status');
      statusElement.textContent = 'Free';
      statusElement.className = 'status-badge status-free';
    }
    
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      
      document.getElementById('loading').style.display = 'none';
    }
    
    // Manage subscription button
    document.getElementById('manage-subscription-btn').addEventListener('click', async () => {
      try {
        const session = await getSession();
        if (!session) {
          throw new Error('Please log in to manage your subscription');
        }
        
        const response = await fetch('/.netlify/functions/create-portal-session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          }
        });
        
        if (!response.ok) {
          throw new Error('Failed to create portal session');
        }
        
        const { url } = await response.json();
        window.location.href = url;
        
      } catch (error) {
        console.error('Error creating portal session:', error);
        showError('Failed to open subscription management. Please try again.');
      }
    });
    
    // Logout button
    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to sign out?')) {
        await signOut();
      }
    });
    
    // Load account info when page loads
    document.addEventListener('DOMContentLoaded', loadAccountInfo);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AITariffTracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .signup-container {
      background: white;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .logo h1 {
      color: #2563eb;
      font-size: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #374151;
      font-weight: 500;
    }
    
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 1rem;
    }
    
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: #1d4ed8;
    }
    
    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    
    .error-message {
      background: #fef2f2;
      color: #dc2626;
      padding: 0.75rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
    }
    
    .success-message {
      background: #f0fdf4;
      color: #16a34a;
      padding: 0.75rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      border: 1px solid #bbf7d0;
    }
    
    .links {
      text-align: center;
      margin-top: 1rem;
    }
    
    .links a {
      color: #2563eb;
      text-decoration: none;
    }
    
    .links a:hover {
      text-decoration: underline;
    }
    
    .divider {
      margin: 1rem 0;
      text-align: center;
      color: #6b7280;
    }
    
    .password-requirements {
      font-size: 0.875rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">
      <h1>AITariffTracker</h1>
      <p>Create your account</p>
    </div>
    
    <div id="error-message" class="error-message" style="display: none;"></div>
    <div id="success-message" class="success-message" style="display: none;"></div>
    
    <form id="signup-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
        <div class="password-requirements">
          Password must be at least 6 characters long
        </div>
      </div>
      
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>
      
      <button type="submit" class="btn" id="signup-btn">Create Account</button>
    </form>
    
    <div class="divider">or</div>
    
    <div class="links">
      <p>Already have an account? <a href="/login.html">Sign in</a></p>
      <p><a href="/">Back to Home</a></p>
    </div>
  </div>
  
  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const signupBtn = document.getElementById('signup-btn');
      const errorDiv = document.getElementById('error-message');
      const successDiv = document.getElementById('success-message');
      
      // Hide previous messages
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      
      // Validate passwords match
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }
      
      // Validate password length
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters long';
        errorDiv.style.display = 'block';
        return;
      }
      
      // Disable button and show loading
      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating account...';
      
      try {
        const result = await signUp(email, password);
        
        if (result.success) {
          successDiv.textContent = 'Account created successfully! Please check your email to verify your account.';
          successDiv.style.display = 'block';
          
          // Clear form
          document.getElementById('signup-form').reset();
          
          // Redirect to login after a delay
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 3000);
        } else {
          errorDiv.textContent = result.error;
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = 'An unexpected error occurred. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        // Re-enable button
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });
    
    // Check if user is already logged in
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await getCurrentUser();
      if (user) {
        window.location.href = '/account.html';
      }
    });
  </script>
</body>
</html>
